<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0F1E;--panel:#111A30;--ink:#EDF1FA;--mute:#98A4BD;--line:#24304D;--rule:#3B4B6F;--blue:#7BA3FF;--orange:#FFA05A;--red:#FF6E8E;--glow1:rgba(255,160,90,.13);--glow2:rgba(123,163,255,.17);--sh:0 24px 60px -26px rgba(0,0,0,.75)}}
:root[data-theme="dark"]{--bg:#0A0F1E;--panel:#111A30;--ink:#EDF1FA;--mute:#98A4BD;--line:#24304D;--rule:#3B4B6F;--blue:#7BA3FF;--orange:#FFA05A;--red:#FF6E8E;--glow1:rgba(255,160,90,.13);--glow2:rgba(123,163,255,.17);--sh:0 24px 60px -26px rgba(0,0,0,.75)}

body::after{content:"";position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;width:100%;transform:scaleX(var(--p,0));transform-origin:left;background:linear-gradient(90deg,var(--orange),var(--blue),var(--red));transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:5}

.slide.on :is(li,.rw):nth-child(4){animation-delay:.3s}
.slide.on :is(li,.rw):nth-child(5){animation-delay:.4s}
.pt.nb{stroke:var(--ink);stroke-width:.9}

.ctl{display:flex;align-items:center;gap:1.2vw;font-size:clamp(14px,1.7vw,22px);padding:1.4vh 1.4vw;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}

.head{flex:0 0 30%}

.nd{width:var(--nd);height:var(--nd);border-radius:50%;background:var(--ac);color:var(--bg);display:grid;place-items:center;font-size:calc(var(--nd)*.5);font-weight:800;margin-bottom:2.4vh;box-shadow:0 0 0 .22em color-mix(in srgb,var(--ac) 22%,transparent)}

.steps.plain .stp{display:flex;flex-direction:column;align-items:center;text-align:center;padding:3.4vh 1.6vw 3.8vh}.steps.plain .stp b{display:flex;align-items:center;justify-content:center;min-height:2.5em;margin:0;text-align:center}.stp span{display:block;color:var(--mute);font-size:clamp(14px,1.6vw,22px);line-height:1.45}

.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:2vw;align-items:center}
.chip{padding:2.8vh 1.8vw;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--sh);font-size:clamp(17px,2.3vw,32px);font-weight:600}

.note{margin:0;color:var(--mute);font-size:clamp(14px,1.6vw,22px);padding:1.3vh 1.3vw;border-left:3px solid var(--sc);background:color-mix(in srgb,var(--sc) 8%,transparent);border-radius:0 12px 12px 0;max-width:62ch}
.note b{color:var(--ink)}
.bar{position:fixed;left:3vw;right:3vw;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:56px;display:flex;align-items:center;justify-content:space-between;gap:2vw;padding:0 10px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 74%,transparent);backdrop-filter:blur(14px);box-shadow:var(--sh);color:var(--mute);font-size:14px}
.bar button.nav{font:inherit;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 18px;cursor:pointer;transition:border-color .2s,transform .2s}

#prev::before{content:"←";margin-right:.5em}#next::after{content:"→";margin-left:.5em}

.mid{flex:1;display:flex;align-items:center;gap:2vw;min-width:0;justify-content:center}
.pn{flex:0 0 auto;min-width:16ch;text-align:right;white-space:nowrap}
.axis{position:relative;display:flex;align-items:center;justify-content:space-between;flex:1;max-width:620px}
.axis::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;margin-top:-1px;border-radius:2px;background:var(--rule)}
.tk{width:20px;height:30px;padding:0;border:0;background:none;position:relative;cursor:pointer}

.tk:hover::before{transform:translate(-50%,-50%) scale(1.25)}
.tk.past::before{background:var(--c)}

.pc{flex:0 0 auto;min-width:6ch;text-align:left;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
@media (max-width:760px){.slide.on{flex-direction:column;align-items:flex-start;overflow:auto;gap:2vh}.figs,.figs.two,.figs.hero,.figs.play{flex:none;width:min(84vw,50vh)}.figs.two{width:92vw}.tbl,pre.code{max-width:100%}.head{flex:none}.steps{grid-template-columns:1fr}.stp::after{display:none}.mrow{grid-template-columns:1fr}.mrow i{display:none}.pn,.axis{display:none}.mid{justify-content:center}}

.ml{margin:3.2vh 0 0;max-width:54ch;font-size:clamp(13px,1.45vw,19px);line-height:1.55;color:var(--ink);padding:1.4vh 1.3vw;border-left:3px solid var(--sc);background:color-mix(in srgb,var(--sc) 8%,transparent);border-radius:0 12px 12px 0}

các_quả = [
    (75, 4, "quýt"), (82, 5, "quýt"), (95, 5, "quýt"),
    (88, 6, "quýt"), (74, 6, "quýt"), (100, 7, "quýt"),

]

    khoảng_cách.append((round(d, 1), loại))

# Bước 2: xếp từ gần đến xa, lấy K quả đầu
khoảng_cách.sort()
gần_nhất = khoảng_cách[:K]
print(gần_nhất)

# Bước 3: loại nào xuất hiện nhiều nhất thì thắng

document.querySelectorAll("pre.code").forEach(p=>{p.innerHTML=p.innerHTML.replace(/\b(from|import)\b|\b([A-Za-z_]\w*)(?=\()|\b(\d+)\b/g,(m,k,f)=>`<i class="${k?"k":f?"f":"n"}">${m}</i>`)});
const sl=[...document.querySelectorAll(".slide")];let cur=0;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
/* ---- hero động ---- */
(function(){
  const svg=document.getElementById("hero");
  let s='<line/><line/><line/>';
  DS.forEach(p=>s+=p.o?`<circle class="pt" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.1" fill="var(--orange)"/>`:`<rect class="pt" x="${(p.x-2).toFixed(1)}" y="${(p.y-2).toFixed(1)}" width="4" height="4" fill="var(--blue)"/>`);
  s+='<path d="M0 -5L4.8 3.6H-4.8Z" stroke="var(--ink)" stroke-width="1"/>';
  svg.innerHTML=s;
  const ln=[...svg.querySelectorAll("line")],pt=[...svg.querySelectorAll(".pt")],tri=svg.querySelector("path");
  ln.forEach(l=>{l.setAttribute("stroke","var(--red)");l.setAttribute("stroke-width",".5")});
  function frame(t){
    const x=50+27*Math.sin(t/2600),y=50+22*Math.sin(t/1800+1.3);
    const nn=DS.map((p,i)=>({i,o:p.o,d:Math.hypot(p.x-x,p.y-y)})).sort((a,b)=>a.d-b.d).slice(0,3);
    pt.forEach(p=>p.classList.remove("nb"));
    nn.forEach((p,j)=>{pt[p.i].classList.add("nb");ln[j].setAttribute("x1",x);ln[j].setAttribute("y1",y);ln[j].setAttribute("x2",DS[p.i].x);ln[j].setAttribute("y2",DS[p.i].y)});
    tri.setAttribute("transform",`translate(${x.toFixed(2)} ${y.toFixed(2)})`);
    tri.setAttribute("fill",nn.reduce((n,p)=>n+p.o,0)>=2?"var(--orange)":"var(--blue)");
  }
  if(reduce)frame(4200);else requestAnimationFrame(function loop(t){if(cur===2&&!document.hidden)frame(t);requestAnimationFrame(loop)});
})();
/* ---- slide tương tác ---- */
(function(){
  const pl=document.querySelector(".play");if(!pl)return;
  const svg=pl.querySelector(".pgsvg"),txt=pl.querySelector(".pgtxt"),rg=pl.querySelector(".pk"),kv=pl.querySelector(".pkv");
  let q=[50,50],K=3,drag=false;
  function draw(){
    const P=DS.map(p=>({x:p.x,y:p.y,o:p.o,d:Math.hypot(p.x-q[0],p.y-q[1])})).sort((a,b)=>a.d-b.d);
    const nn=P.slice(0,K),no=nn.reduce((n,p)=>n+p.o,0),nb=K-no,R=(P[K-1].d+P[K].d)/2,set=new Set(nn);
    let s=AX+`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${R.toFixed(1)}" fill="none" stroke="var(--red)" stroke-width=".7" stroke-dasharray="2 1.5"/>`;
    nn.forEach(p=>s+=`<line x1="${q[0].toFixed(1)}" y1="${q[1].toFixed(1)}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="var(--red)" stroke-width=".4" opacity=".6"/>`);
    P.forEach(p=>{const st=set.has(p)?' stroke="var(--ink)" stroke-width=".9"':'';
      s+=p.o?`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="1.9" fill="var(--orange)"${st}/>`:`<rect x="${(p.x-1.8).toFixed(1)}" y="${(p.y-1.8).toFixed(1)}" width="3.6" height="3.6" fill="var(--blue)"${st}/>`});
    s+=`<path d="M${q[0].toFixed(1)} ${(q[1]-4.4).toFixed(1)}L${(q[0]+4.2).toFixed(1)} ${(q[1]+3.2).toFixed(1)}H${(q[0]-4.2).toFixed(1)}Z" fill="var(--${no>nb?"orange":"blue"})" stroke="var(--ink)" stroke-width="1"/>`;
    svg.innerHTML=s;
    txt.innerHTML=`K = ${K}: ${no} cam, ${nb} xanh, dự đoán <b>${no>nb?"cam":"xanh"}</b>`;
  }
  const mv=e=>{const r=svg.getBoundingClientRect();q=[Math.max(12,Math.min(88,(e.clientX-r.left)/r.width*100)),Math.max(12,Math.min(86,(e.clientY-r.top)/r.height*100))];draw()};
  svg.addEventListener("pointerdown",e=>{drag=true;svg.setPointerCapture(e.pointerId);mv(e)});
  svg.addEventListener("pointermove",e=>{if(drag)mv(e)});
  svg.addEventListener("pointerup",()=>drag=false);
  svg.addEventListener("pointercancel",()=>drag=false);
  rg.addEventListener("input",()=>{K=+rg.value;kv.textContent=K;draw()});
  rg.addEventListener("pointerup",()=>rg.blur());
  draw();
})();
/* ---- ranh giới theo K ---- */
(function(){
  const b=document.querySelector(".bnd");if(!b)return;
  const rg=document.querySelector(".bk"),kv=document.querySelector(".bkv");
  const cap=K=>K<=3?"K = "+K+": ranh giới quá phức tạp: overfitting":K>=17?"K = "+K+": ranh giới quá trơn: underfitting":"K = "+K+": ranh giới cân bằng hơn";
  function dr(){const K=+rg.value;kv.textContent=K;b.innerHTML=bound(K)+`<p>${cap(K)}</p>`}

const axis=document.getElementById("axis");

const tks=[...axis.children];
function go(n){
  cur=Math.max(0,Math.min(sl.length-1,n));
  sl.forEach((e,i)=>e.classList.toggle("on",i===cur));
  tks.forEach((t,i)=>{t.classList.toggle("past",i<cur);t.classList.toggle("cur",i===cur)});
  document.getElementById("pn").textContent=S[cur].p.split(":")[0];
  document.getElementById("num").textContent=(cur+1)+" / "+sl.length;
  document.body.style.setProperty("--p",cur/(sl.length-1));
  try{history.replaceState(null,"","#s"+(cur+1))}catch(e){}
}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
const themes=[null,"light","dark"];let ti=0;
addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  const onBtn=e.target.closest&&e.target.closest("button");
  if(e.key==="ArrowRight"||e.key==="PageDown"||(e.key===" "&&!onBtn)){e.preventDefault();go(cur+1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"||e.key==="Backspace"){e.preventDefault();go(cur-1)}
  else if(e.key==="Home")go(0);
  else if(e.key==="End")go(sl.length-1);
  else if(e.key==="t"||e.key==="T"){ti=(ti+1)%3;const r=document.documentElement;themes[ti]?r.setAttribute("data-theme",themes[ti]):r.removeAttribute("data-theme")}
});
let tx=null;
addEventListener("touchstart",e=>{tx=e.target.closest&&e.target.closest(".play,.axis,.ctl,.pyg")?null:e.touches[0].clientX});
addEventListener("touchend",e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)go(cur+(d<0?1:-1));tx=null});


/* ---- bản JavaScript tương đương đoạn Python ở Ô 1 ---- */
(function(){
  const btn=document.getElementById("pyrun");if(!btn)return;
  const code=document.getElementById("pycode");
  const sync=()=>{
    const g=id=>document.getElementById(id).value.trim()||"?";
    code.value=code.value.replace(/(quả_mới = )\([^)]*\)/,"$1("+g("f1")+", "+g("f2")+")").replace(/^(K = )\S+/m,"$1"+g("kk"));
  };
  ["f1","f2","kk"].forEach(id=>document.getElementById(id).addEventListener("input",sync));
  sync();
  const F=[[75,4,"quýt"],[82,5,"quýt"],[95,5,"quýt"],[88,6,"quýt"],[74,6,"quýt"],[100,7,"quýt"],[189,8,"cam"],[201,8,"cam"],[214,8,"cam"],[208,7,"cam"],[226,7,"cam"],[180,4,"cam"],[182,2,"táo"],[200,1,"táo"],[168,2,"táo"],[190,3,"táo"],[210,2,"táo"],[197,6,"táo"]];
  const rnd1=x=>{const s=x*10,f=Math.floor(s);return s-f===.5?(f%2===0?f:f+1)/10:Number(x.toFixed(1))};
  const f1=x=>{const r=rnd1(x);return Number.isInteger(r)?r.toFixed(1):String(r)};
  btn.addEventListener("click",()=>{
    const out=document.getElementById("pyout"),v=id=>document.getElementById(id).value;
    const q=[+v("f1"),+v("f2")],K=Math.trunc(+v("kk"));
    if(!isFinite(q[0])||!isFinite(q[1])||v("f1")===""||v("f2")===""){out.textContent="Dữ liệu chưa hợp lệ: cân nặng và độ sần phải là số";return}
    if(!(K>=1&&K<=F.length)){out.textContent="Dữ liệu chưa hợp lệ: K phải từ 1 đến "+F.length+" (chỉ có "+F.length+" mẫu)";return}
    const d=F.map(r=>{const dx=r[0]-q[0],dy=r[1]-q[1];return[rnd1(Math.sqrt(dx*dx+dy*dy)),r[2]]});
    d.sort((a,b)=>a[0]-b[0]||(a[1]<b[1]?-1:a[1]>b[1]?1:0));
    const nn=d.slice(0,K),kinds=nn.map(o=>o[1]),cnt=k=>kinds.filter(x=>x===k).length;
    let pred=kinds[0];kinds.forEach(k=>{if(cnt(k)>cnt(pred))pred=k});
    out.textContent="["+nn.map(o=>"("+f1(o[0])+", '"+o[1]+"')").join(", ")+"]\nDự đoán: "+pred;
    btn.blur();
  });
})();
const m=/^#s(\d+)$/.exec(location.hash);go(m?+m[1]-1:0);
